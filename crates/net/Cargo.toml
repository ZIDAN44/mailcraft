[package]
name = "mailcraft-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MailCraft network layer (native only): IMAP client and sync, SMTP submission, per-account workers"

[lints]
workspace = true

[dependencies]
mailcraft-model = { workspace = true }
mailcraft-mime = { workspace = true }
mailcraft-smime = { workspace = true }
mailcraft-keys = { workspace = true }
# The system's randomness, for S/MIME's keys and signatures.
rand_core = { version = "0.6", features = ["getrandom"] }
# The roots the system trusts (Windows' and macOS' stores, Linux's bundle), for S/MIME signers.
rustls-native-certs = "0.8"
mailcraft-store = { workspace = true }
# the system's time zone, for calendar times written without one
iana-time-zone = "0.1"
mailcraft-jmap = { workspace = true }
imap-proto = { workspace = true }
lettre = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# SHA-256 and randomness for OAuth's PKCE (already rustls's crypto provider).
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
# WebDAV answers (CalDAV, CardDAV).
quick-xml = "0.42"
# Outlook data files (.pst), for importing them (Microsoft's reader, MIT).
outlook-pst = "1.2"
# Writes them, for exporting (MIT; a fork of the reader with the same library name, so renamed).
pst_rw = { package = "outlook-pst-rw", version = "1.2.14" }
# NTLM sign-in for on-premises Exchange (EWS): MD4, MD5 and HMAC (RustCrypto, MIT / Apache-2.0).
md4 = "0.11"
md-5 = "0.11"
hmac = "0.13"
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The system's DNS resolvers (account autoconfiguration).
ipconfig = "0.3"

[dev-dependencies]
# The S/MIME round trip reads the test certificates (PEM).
der = { version = "0.7", features = ["pem"] }

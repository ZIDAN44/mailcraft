[package]
name = "mailcraft-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft network layer (native only): IMAP client and sync, SMTP submission, per-account workers"

[lints]
workspace = true

[dependencies]
mailcraft-model = { workspace = true }
mailcraft-mime = { workspace = true }
mailcraft-store = { workspace = true }
mailcraft-jmap = { workspace = true }
imap-proto = { workspace = true }
lettre = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# SHA-256 and randomness for OAuth's PKCE (already rustls's crypto provider).
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
# WebDAV answers (CalDAV, CardDAV).
quick-xml = "0.41"
# Outlook data files (.pst), for importing them (Microsoft's reader, MIT).
outlook-pst = "1.2"
# Writes them, for exporting (MIT; a fork of the reader with the same library name, so renamed).
pst_rw = { package = "outlook-pst-rw", version = "1.2.14" }
# NTLM sign-in for on-premises Exchange (EWS): MD4, MD5 and HMAC (RustCrypto, MIT / Apache-2.0).
md4 = "0.10"
md-5 = "0.10"
hmac = "0.12"
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The system's DNS resolvers (account autoconfiguration).
ipconfig = "0.3"

[package]
name = "mailcraft-smime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MailCraft S/MIME (RFC 8551): certificates from .p12 files, signatures made and checked, mail encrypted and decrypted (pure Rust, wasm-safe)"

[lints]
workspace = true

# RustCrypto, all MIT OR Apache-2.0, one generation (der 0.7, digest 0.10) so each is built once.
[dependencies]
der = { version = "0.8", features = ["alloc", "derive", "oid", "pem"] }
spki = { version = "0.8", features = ["alloc"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
cms = { version = "0.2.3", features = ["builder"] }
const-oid = { version = "0.10", features = ["db"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
aes = "0.9"
# AES key wrap (RFC 3394), for EC recipients' keys.
aes-kw = "0.3"
# OCSP requests and answers (RFC 6960), for revocation checks.
x509-ocsp = { version = "0.2.1", features = ["builder"] }
cbc = { version = "0.2", features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
des = "0.9"
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
pkcs8 = { version = "0.11", features = ["alloc"] }
thiserror = { workspace = true }
signature = "3"
rand_core = "0.6"

# .p12 / .pfx files: PBES2 (PBKDF2, AES) and the older 3DES and RC2-40 ones.
p12-keystore = "0.4.1"

# rand_core asks the system for randomness through getrandom (the caller's generator is what's
# used here); in the browser that's `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# p12-keystore's (through rand 0.9): the browser's too.
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

[package]
name = "mailcraft-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MailCraft egui front end (folders, message list, reading pane, compose); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
mailcraft-engine = { workspace = true }
# egui's emoji and symbol fonts, as egui had them by default before 0.37: emoji in subjects and
# text, and symbols such as ▾, otherwise draw as empty boxes.
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Attachment thumbnails (pictures arrive in mail, decoded with size limits).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Right-to-left text: the Unicode Bidirectional Algorithm, and fonts' character maps (the
# version egui's text layout uses).
unicode-bidi = "0.3"
# The version egui's own text (epaint) uses, so the font reader is built once.
skrifa = "0.49"
# The system's interface language.
sys-locale = "0.3"
# PDF attachment thumbnails: a pure-Rust rasterizer (no unsafe code).
hayro = { version = "0.9", default-features = false }
# A search's time each frame: std's clock panics in the browser (the version egui's winit uses).
web-time = "1.1"

[dev-dependencies]
# The a11y guard's test: the consumer the system adapters run, fed with our updates. The version
# egui already brings in, so nothing is built twice.
accesskit_consumer = "=0.39.2"

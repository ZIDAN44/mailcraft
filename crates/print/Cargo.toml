[package]
name = "mailcraft-print"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MailCraft print and export: a message laid out on pages as a PDF (pure, wasm-safe)"

[lints]
workspace = true

[dependencies]
# Reads the font it embeds (glyphs, widths, metrics): the maintained successor to ttf-parser, and
# the version the UI uses, so it's built once.
skrifa = "0.49"
# Compressed page and font streams.
# The version flate2 (the PDF reader's) uses, so it's built once.
miniz_oxide = "0.9"

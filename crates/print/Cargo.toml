[package]
name = "mailcraft-print"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MailCraft print and export: a message laid out on pages as a PDF (pure, wasm-safe)"

[lints]
workspace = true

[dependencies]
# Glyph ids and widths of the system font that gets embedded.
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }
# Compressed page and font streams.
# The version flate2 (the PDF reader's) uses, so it's built once.
miniz_oxide = "0.9"

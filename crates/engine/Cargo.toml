[package]
name = "mailcraft-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MailCraft engine: the session, its command registry and the sans-I/O job/event loop (no network, wasm-safe)"

[lints]
workspace = true

[dependencies]
mailcraft-model = { workspace = true }
mailcraft-mime = { workspace = true }
mailcraft-smime = { workspace = true }
mailcraft-pgp = { workspace = true }
mailcraft-store = { workspace = true }
mailcraft-print = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# A backup of what the browser keeps (issue #83), packed and, with a password, locked: pure
# Rust, wasm too; the generation the S/MIME crate builds already.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"

[dev-dependencies]
# S/MIME tests read PEM and play the network layer's decrypting.
der = { version = "0.8", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Property tests of the list's index and arrangement (tests/mail/nav.rs).
proptest = "1"

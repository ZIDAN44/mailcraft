[package]
name = "mailcraft-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft local-first cache: accounts, folders, per-folder sync state, message sources and pending offline changes on disk"

[lints]
workspace = true

[dependencies]
mailcraft-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# Native only (the browser keeps its cache in memory).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Each account's mail in one data file (`packed.rs`): a crash-safe, pure-Rust embedded database.
redb = "=4.3.0"
# What a data file keeps is compressed (deflate, pure Rust): mail and folder lists are text.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The Documents folder (where "MailCraft Files" goes), wherever the system has put it.
dirs = "6"

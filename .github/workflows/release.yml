# Builds, signs and packages MailCraft for every platform, then drafts a GitHub Release:
# macOS universal (.dmg + CLI zip), Windows x64/x86/arm64 (.msi + portable zip), Linux
# x86_64/aarch64 (AppImage, deb, rpm, tar.gz, Flatpak), Linux riscv64, FreeBSD and the web. Runs on a
# push to the `release` branch, or by hand with an optional version override for a test run.
# The scripts it calls live in packaging/; the version comes from Cargo.toml.
# Browser sign-in (MAILCRAFT_MICROSOFT_CLIENT_ID, MAILCRAFT_GOOGLE_CLIENT_ID/_SECRET) isn't passed
# here: the shared workflow takes only the secrets it declares, and passing others fails the run.
# Whoever ships this build registers their own app and adds a pass-through there (docs/oauth.md);
# release-wip.yml, which builds in this repository, passes them already.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

# Read-only by default; the one job that drafts the release gets write access below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The shared workflow drafts the GitHub Release, which needs write access to contents (a
    # sibling app that dropped the workflow-wide grant without this one had its release fail at
    # startup).
    permissions:
      contents: write
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: mailcraft
      app-title: MailCraft
      version: ${{ inputs.version }}
      # storytold/craft-fonts, pinned (bump deliberately; the same commit as release-wip.yml
      # and freebsd.yml): Arabic, Hebrew, Japanese, Chinese, Korean, Thai
      # and other fallback fonts, built in through CRAFT_FONTS_DIR (crates/ui-egui/build.rs).
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      # The web job checks the same commit out too; build.rs picks the faces the browser gets.
      web-craft-fonts: true
      # The browser app (apps/mailcraft-web, JMAP over fetch): packaging/web/package.sh.
      has-web: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}

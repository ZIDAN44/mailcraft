name: fuzz

# Once a week, every fuzz target (fuzz/README.md) gets FUZZ_SECONDS on Linux, starting from
# the corpus the previous run left behind plus our seeds. When a target crashes the run goes red
# and keeps the inputs that did it as a downloadable artifact.
on:
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "150"

concurrency:
  group: fuzz
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A run that hits the job's timeout-minutes is cancelled and reports nothing, not even a crash.
  # Eight minutes to compile, then FUZZ_SECONDS plus two for every target, must fit inside it.
  FUZZ_SECONDS: ${{ github.event.inputs.seconds || '150' }}
  # cargo-fuzz builds for the target it was itself built for, and install-action's cargo-fuzz is a
  # musl build: the address sanitizer can't link musl's static libc, so name the runner's own.
  FUZZ_TARGET: x86_64-unknown-linux-gnu

jobs:
  targets:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: fuzz
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Compile every target
        working-directory: fuzz
        run: cargo +nightly fuzz build -O --target "$FUZZ_TARGET"
      - name: Run the targets one after another
        working-directory: fuzz
        shell: bash
        run: |
          crashed=()
          for target in $(cargo +nightly fuzz list); do
            echo "::group::fuzzing $target"
            mkdir -p "corpus/$target"
            if ! cargo +nightly fuzz run -O --target "$FUZZ_TARGET" "$target" "corpus/$target" "seeds/$target" -- \
              -dict="dicts/$target.dict" -max_len=65536 -rss_limit_mb=2048 -timeout=10 \
              -max_total_time="$FUZZ_SECONDS" -print_final_stats=1; then
              crashed+=("$target")
            fi
            echo "::endgroup::"
          done
          if (( ${#crashed[@]} )); then
            echo "::error::targets that crashed: ${crashed[*]}"
            exit 1
          fi
      - name: Keep the inputs that crashed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          path: fuzz/artifacts
          name: crashing-inputs

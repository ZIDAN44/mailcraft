# Dependency updates, as the other Craft apps get them: one grouped pull request per ecosystem,
# weekly rather than their daily (each pull request runs the CI gate on three systems). The forks
# pinned by revision (storytold's egui and winit, craft-libs) aren't touched: they
# move with the suite, by hand. Actions pinned by commit are kept current here too (as
# `npx actions-up` does); craft-common-actions stays on @main on purpose.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    # A release is offered once it's a week old, as the shared actions' updates are: one pulled
    # or found bad in its first days never reaches a pull request.
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    # Held back on purpose (patch releases still come):
    # - S/MIME's RustCrypto crates move as one family. rsa 0.10 is out, but cms 0.3, x509-ocsp
    #   0.3 and pkcs12 0.2, which the next one needs (p12-keystore's newer releases take cms
    #   0.3), are still release candidates; rPGP is on this one too until rpgp/rpgp#573. Drop
    #   these once those are stable.
    # - zbus: notify-rust is on 6, but AccessKit (and its AT-SPI), the tray's ksni and the
    #   keychain's Secret Service store are on 5, so both are built either way; the theme
    #   watcher stays on 5 and moves with them.
    # - skrifa: the app checks a font with egui's own (0.44, held there by the egui fork), as a
    #   newer one reads files egui's doesn't and egui stops on; it moves with the fork, by hand.
    #   Dependabot can't hold one crate's skrifa alone, so ui-egui's and print's move by hand too.
    ignore:
      - dependency-name: "aes"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "aes-gcm"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "aes-kw"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "cbc"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "const-oid"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "der"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "des"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "getrandom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "p12-keystore"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "p256"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "p384"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "pkcs8"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha1"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "signature"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "skrifa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "spki"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "x509-cert"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "zbus"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    # A release is offered once it's a week old, as the shared actions' updates are: one pulled
    # or found bad in its first days never reaches a pull request.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "storytold/craft-common-actions"
    commit-message:
      prefix: "Workflows"

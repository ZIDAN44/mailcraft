[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# `fuzz` is its own workspace (nightly, libFuzzer).
exclude = ["fuzz"]

[workspace.package]
version = "0.35.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/ZIDAN44/mailcraft"

[workspace.dependencies]
# internal
mailcraft-model = { path = "crates/model" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-store = { path = "crates/store" }
mailcraft-pst = { path = "crates/pst" }
mailcraft-jmap = { path = "crates/jmap" }
mailcraft-print = { path = "crates/print" }
mailcraft-smime = { path = "crates/smime" }
mailcraft-pgp = { path = "crates/pgp" }
mailcraft-keys = { path = "crates/keys" }
mailcraft-net = { path = "crates/net" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-ui-egui = { path = "crates/ui-egui" }

# The Craft apps' shared crates (storytold/craft-libs), all at one revision: kept up by the suite,
# so their fixes reach MailCraft with a bump of this pin.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "38740b43a901022bf8cf0ede19e59ea606dc11a9" }
craft-docpath = { git = "https://github.com/storytold/craft-libs", rev = "38740b43a901022bf8cf0ede19e59ea606dc11a9" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
unicode-segmentation = "1"
# time zones: the IANA database built in (pure data, wasm-safe; MIT OR Apache-2.0)
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }

# mail (all MIT and/or Apache-2.0)
# `full_encoding`: mail in Shift_JIS, GBK, Big5 and EUC-KR (without it those came out as U+FFFD).
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
mail-builder = { version = "2", default-features = false }
html2text = { version = "0.17", features = ["css"] }
imap-proto = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

# ui
egui = "0.37"
eframe = { version = "0.37", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Line tables only for MailCraft's own crates (a panic still says file:line) and no debug
# information for the others: links, the target folder and Windows' PDBs shrink a lot (as the
# other Craft apps build; the shared CI gate already sets it).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "thin"

# egui 0.37 and winit 0.30.13 as the Craft apps build them: storytold's forks, pinned to the
# same revisions as GridCraft, WordCraft, PdfCraft, DeckCraft and PhotoCraft. Each fix in them is
# listed in the fork's PATCHES.md; bump these with the other apps.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

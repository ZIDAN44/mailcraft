[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/ZIDAN44/mailcraft"

[workspace.dependencies]
# internal
mailcraft-model = { path = "crates/model" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-store = { path = "crates/store" }
mailcraft-jmap = { path = "crates/jmap" }
mailcraft-print = { path = "crates/print" }
mailcraft-net = { path = "crates/net" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
unicode-segmentation = "1"

# mail (all MIT and/or Apache-2.0)
mail-parser = "0.11"
mail-builder = { version = "1", default-features = false }
html2text = { version = "0.17", features = ["css"] }
imap-proto = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# Patched copies of upstream crates (vendor/README.md): not workspace members, so its lints and
# tests stay theirs.
exclude = ["vendor"]

[workspace.package]
version = "0.22.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/ZIDAN44/mailcraft"

[workspace.dependencies]
# internal
mailcraft-model = { path = "crates/model" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-store = { path = "crates/store" }
mailcraft-jmap = { path = "crates/jmap" }
mailcraft-print = { path = "crates/print" }
mailcraft-net = { path = "crates/net" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
unicode-segmentation = "1"
# time zones: the IANA database built in (pure data, wasm-safe; MIT OR Apache-2.0)
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }

# mail (all MIT and/or Apache-2.0)
mail-parser = "0.11"
mail-builder = { version = "1", default-features = false }
html2text = { version = "0.17", features = ["css"] }
imap-proto = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

# ui
egui = "0.37"
eframe = { version = "0.37", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

# mail-parser 0.11 has a `debug_assert!` that hostile mail reaches (a message in a message ended
# by the outer boundary; crates/mime/src/tests.rs): off, debug builds read it as release ones do.
[profile.dev.package.mail-parser]
debug-assertions = false

[profile.release]
opt-level = 3
lto = "thin"

# winit 0.30.13 with the upstream fixes no 0.30 release has (vendor/README.md), as PdfCraft carries.
[patch.crates-io]
winit = { path = "vendor/winit" }

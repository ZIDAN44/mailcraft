[package]
name = "mailcraft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "MailCraft on the command line: accounts, sync, list, read, search, send, and every engine command"

[lints]
workspace = true

[[bin]]
name = "mailcraft-cli"
path = "src/main.rs"

[dependencies]
mailcraft-engine = { workspace = true }
mailcraft-net = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

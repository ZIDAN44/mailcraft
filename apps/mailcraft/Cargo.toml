[package]
name = "mailcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "MailCraft desktop app"
default-run = "mailcraft"

[lints]
workspace = true

[dependencies]
mailcraft-engine = { workspace = true }
mailcraft-net = { workspace = true }
mailcraft-ui-egui = { workspace = true }
# Without default features, so each is named: "clipboard" is copy and paste (eframe 0.37 made it
# a feature of its own; leaving it out leaves the app without a clipboard).
eframe = { workspace = true, features = ["clipboard", "default_fonts", "system_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The local UTC offset for message times.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
# Native file dialogs (attach, save as).
rfd = "0.17"
# Open attachments with the system's default app.
open = "5"
# Pictures pasted into a message.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Desktop notifications for new mail (toasts, Notification Center, freedesktop notifications).
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Decodes the window icon (assets/app-icon).
image = { version = "0.25", default-features = false, features = ["png"] }
# Passwords live in the system keychain, never in MailCraft's files.
# keyring 4's `v1` API picks the system's own store: Credential Manager (`{user}.{service}`,
# as keyring 3 named them), the Keychain, or the Secret Service (found by service and user, so
# what keyring 3 saved still reads).
keyring = "4.2"

[build-dependencies]
# Icon + VERSIONINFO for mailcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Notifications under MailCraft's name: its app id's name and icon, per user (`toast.rs`).
# The version ipconfig (the network crate's DNS settings) uses, so it's built once.
windows-registry = "0.100"
# One MailCraft per data folder (`single_instance.rs`): Unix sockets on Windows, which std lacks.
# The version zbus brings, so it's built once.
uds_windows = "1.2"
# The Windows session the single-instance socket is named by (the process token's session id):
# safe wrappers over Win32, only the `advapi` feature (as PdfCraft has it).
winit = { version = "0.30", default-features = false }
winsafe = { version = "0.0.29", default-features = false, features = ["advapi", "dwm", "user"] }
# MailCraft's icon in the notification area, for running with its window closed (`desktop/tray.rs`).
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Finder hands documents to an app through an `odoc` Apple event; winit 0.30 never sees it
# (see `src/apple_events.rs`). Hooking it takes Objective-C, so `unsafe`, which we forbid, and
# this small crate hides that behind a safe queue. WordCraft, PdfCraft, GridCraft and DeckCraft
# depend on it too. The `=` pin is deliberate: read what changed upstream before moving it.
fmv-macos-events = "=0.1.0"
# Quitting the Mac way (`apple_events.rs`): `terminate:` from the main queue, and an app menu
# whose Quit (⌘Q) asks first, as craft-libs' quit crate does. objc2, objc2-app-kit and dispatch2
# come in through eframe already; muda builds the menu.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
muda = { version = "0.21.2", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Dragging attachments out under X11 (XDND), in safe Rust; and the window's id for it. The
# version winit and arboard use, so it's built once.
x11rb = "0.14"
raw-window-handle = "0.6"
# Opening the window through XWayland (`display.rs`); the version eframe uses, so it's built once.
winit = { version = "0.30", default-features = false, features = ["x11"] }
# The desktop's dark or light preference (the freedesktop portal, `appearance.rs`): winit reports
# no theme here. zbus comes in through AccessKit already; this only makes it direct.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# MailCraft's icon in the notification area (a StatusNotifierItem over D-Bus), for running with
# its window closed (`desktop/tray.rs`). On zbus with async-io, as above.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
# The drag test plays the user on a virtual X server (Xvfb).
x11rb = { version = "0.14", features = ["xtest"] }

# Dragging attachments out of the window to other apps (Linux and the BSDs: `xdnd.rs`).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = "2.1"

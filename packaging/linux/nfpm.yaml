# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: mailcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: mail
priority: optional
maintainer: ${MAILCRAFT_MAINTAINER}
vendor: Learning Machines LLC
homepage: https://github.com/ZIDAN44/mailcraft
license: MIT OR Apache-2.0
description: |-
  Open-source, local-first email client with the familiar three-pane mail
  workflow over IMAP and SMTP: several accounts and a unified inbox, a
  date-grouped message list, reading pane, conversations, offline cache and
  search, drafts, attachments; passwords in the system keyring.
  Includes mailcraft-cli, a command-line client and command runner.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries. D-Bus (the keyring) is spoken in pure Rust; a Secret Service
# provider (GNOME Keyring, KWallet, KeePassXC) stores the passwords.
overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC_FLOOR})
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      - gnome-keyring | kwalletmanager | keepassxc
      - xdg-utils
  rpm:
    depends:
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal
      - xdg-utils

contents:
  - src: ${STAGE}/usr/bin/mailcraft
    dst: /usr/bin/mailcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/mailcraft-cli
    dst: /usr/bin/mailcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh

# Flatpak manifest for the single-file bundle attached to every GitHub release
# (mailcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (mailcraft-<version>-linux-<arch>.tar.gz, built
# on Ubuntu 22.04 by package.sh) instead of compiling Rust inside
# flatpak-builder: no network and no vendored crate sources during the build, a few seconds
# instead of 20+ minutes, and byte-for-byte the same binaries as the AppImage/deb/rpm. The script
# unpacks the tarball into `stage/` next to a copy of this file. The binaries need glibc >= 2.35
# and load X11, Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all
# of them, and the GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# ai.storyteller.mailcraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime-version and finish-args identical in both (packaging-lint checks this).
id: ai.storyteller.mailcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: mailcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # IMAP and SMTP: MailCraft talks to the user's own mail servers directly.
  - --share=network
  # Passwords live in the user's keyring (Secret Service: GNOME Keyring, KWallet, KeePassXC).
  - --talk-name=org.freedesktop.secrets
  # Attach and Save dialogs go through the file-chooser portal (rfd), and attachments open with
  # the OpenURI portal, so picked files work anywhere without broad filesystem access.
  # Downloads is granted so saved attachments land in the usual place.
  - --filesystem=xdg-download
  # Deliberately not granted: home/host filesystem access and sound. The mail cache lives in the
  # sandbox's own data folder (~/.var/app/ai.storyteller.mailcraft/data/mailcraft).
modules:
  - name: mailcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/mailcraft /app/bin/mailcraft
      - install -Dm755 bin/mailcraft-cli /app/bin/mailcraft-cli
      - install -Dm644 share/applications/ai.storyteller.mailcraft.desktop /app/share/applications/ai.storyteller.mailcraft.desktop
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.mailcraft.metainfo.xml /app/share/metainfo/ai.storyteller.mailcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/mailcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
